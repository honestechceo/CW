<title>Cartel Wars</title>
<style>
/* Layout: classic iPhone app shell. Navy nav bar, status strip, striped list content, black tab bar. Single fixed look by design. */
:root{

tr.me td{background:#fbefc6;font-weight:700}
input,select{background:#fff;border:1px solid #9aa4b4;border-radius:6px;font:inherit;font-size:14px;padding:7px 9px;min-width:0;color:var(--ink)}
.msgs{display:grid}
.msg{padding:7px 14px;border-bottom:1px solid var(--sep);font-size:13.5px;overflow-wrap:anywhere}
.msg:nth-child(even){background:var(--row2)}
.msg .n{font-weight:700;color:var(--navy2)} .msg.me .n{color:var(--green)} .msg.sys{color:var(--sub);font-style:italic}

.vs .mid{font:900 20px var(--ui);color:var(--sub)}
.side{min-width:0}
.side small{color:var(--sub);display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:16px;height:7px;border-radius:2px;background:#dfe3ea}
.pips i.w{background:var(--yellow)}
.hero{display:grid;place-items:center;background:linear-gradient(#eef2f7,#d6dde8);border:1px solid var(--sep);border-radius:8px;height:120px;color:var(--ink)}
.hero svg{height:96px;width:auto;max-width:100%;fill:currentColor}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:rgba(20,22,28,.92);color:#fff;border-radius:10px;padding:10px 14px;max-width:min(400px,calc(100vw - 32px));z-index:9;font-size:13.5px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.toast.bad{background:rgba(160,30,20,.95)}
.intro{padding:20px 16px;display:grid;gap:12px}
.intro h2{margin:0;font-size:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    listings:[],myListings:[],

}

/* ================= DERIVED ================= */
const xpNeed=l=>Math.round(40*Math.pow(l,1.6));
const myHoods=()=>S.hoods.filter(h=>h.owner==='me');
const isAlly=o=>S.cartel&&o===S.cartel;
const crewName=id=>id==='me'?(S.crew||S.name):(AI_CREWS.find(c=>c.id===id)||{}).name||'Unclaimed';
const stash=()=>PRODUCTS.reduce((a,p)=>a+(S.inv[p.id]||0),0);
const stashCap=()=>25+WEAPONS.filter(w=>w.type==='vehicle').reduce((a,w)=>a+(S.weapons[w.id]||0)*w.cap,0);
const invValue=()=>PRODUCTS.reduce((a,p)=>a+(S.inv[p.id]||0)*S.prices[p.id],0);
const armsValue=()=>Object.entries(S.weapons).reduce((a,[k,v])=>a+(W(k)?W(k).price*v*.5:0),0);
const prodCost=l=>Math.round(7500*Math.pow(2.8,l));
const netWorth=()=>S.cash+S.bank+invValue()+armsValue()+myHoods().length*15000+(S.prod.lvl?prodCost(S.prod.lvl-1)*.6:0);
const rivalWorth=r=>r.cash+r.level*9000+S.hoods.filter(h=>h.owner===r.crew).length*4000;
function board(){const l=S.rivals.map(r=>({name:r.name,crew:crewName(r.crew),level:r.level,worth:rivalWorth(r)}));l.push({name:S.name,crew:S.crew||'—',level:S.level,worth:netWorth(),me:1});return l.sort((a,b)=>b.worth-a.worth)}
const rankOf=()=>board().findIndex(x=>x.me)+1;
const has=id=>(S.weapons[id]||0)>0||(S.gear[id]||0)>0;
const inHosp=()=>now()<S.hospUntil, inJail=()=>now()<S.jailUntil, locked=()=>inHosp()||inJail();
const slotted=lo=>Object.entries(lo).reduce((a,[k,n])=>a+((W(k)&&W(k).slots)||0)*n,0);
function bestTransport(){let b=null;for(const w of WEAPONS)if(w.type==='vehicle'&&S.weapons[w.id]>0&&(!b||w.atk+w.def>b.atk+b.def))b=w;return b}
function setBonus(lo){const full=SETS.filter(s=>s.items.every(i=>lo[i]>0));const over=new Set(full.flatMap(s=>s.over||[]));const sets=full.filter(s=>!over.has(s.id));const pens=PENALTIES.filter(p=>p.t(lo));return{sets,pens,total:sets.reduce((a,s)=>a+s.bonus,0)+pens.reduce((a,p)=>a+p.bonus,0)}}
function totals(lo){
  let ea=0,ed=0;const by={close:0,ranged:0,heavy:0,armor:0};
  for(const[k,n]of Object.entries(lo)){const w=W(k);if(!w||!n||w.type==='vehicle')continue;ea+=w.atk*n;ed+=w.def*n;by[w.type]+=(w.atk+w.def)*n}
  const tr=bestTransport();
  let style='bare';
  if(ea+ed>0){if(ed>=ea*1.4)style='fortress';else{const top=['close','ranged','heavy'].sort((a,b)=>by[b]-by[a])[0];style=by[top]>0?top:'fortress'}}
  return{atk:BASE.atk+ea+(tr?tr.atk:0),def:BASE.def+ed+(tr?tr.def:0),ea,ed,tr,style,bonus:setBonus(lo)};
}
const pBoost=()=>(1+S.sheat/200)*(1+S.soldiers*.02)*(S.cartel?1.1:1);
function meC(){const t=totals(S.presets[S.active].lo);return{atk:t.atk,def:t.def,style:t.style,boost:pBoost()*(1+t.bonus.total*.02)}}
function rivalC(r,which){const st=which||r.style;const q=Math.min(5.8,.7+r.level*.2);const sl=Math.min(110,20+r.level*4);const[ra,rd]=RATIO[st];return{atk:25+Math.round(sl*q*ra)+Math.min(25,r.level),def:25+Math.round(sl*q*rd)+5,style:st,boost:1+r.sh/200}}
const clearCost=pct=>Math.round((300+S.level*250)*pct/10);
const healCost=()=>300+S.level*150;
const bailCost=()=>2000+S.level*1500;
const sheatCost=()=>Math.round(4000*Math.pow(1.45,S.sheatBuys));
const gameHrs=t=>Math.max(0,Math.ceil((t-S.tick)/15));

/* ================= FEEDBACK ================= */
let tt;
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}
function log(m){S.log.unshift({m,t:S.tick});S.log=S.log.slice(0,60)}
function gainXp(x){S.xp+=x;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;S.points+=2;S.energy=S.maxEnergy;S.stam=S.maxStam;if(!inHosp())S.hp=S.maxHp;toast('Level '+S.level+'! 2 upgrade points in My Profile.');log('Reached level '+S.level+' (+2 upgrade points).')}}
function checkAcc(){ACCOLADES.forEach(a=>{if(!S.accolades.includes(a.id)&&a.t(S)){S.accolades.push(a.id);toast('Accolade: '+a.name);log('Accolade earned: '+a.name+'.')}})}
function addHeat(p){S.heat=Math.max(0,Math.min(100,S.heat+p));if(S.heat>=100&&!inJail())jail()}
function jail(){const t=(90+S.level*6)*(S.gear.lawyer?.5:1);S.jailUntil=now()+t*1000;S.heat=35;S.jails++;S.fight=null;toast('Police heat hit 100%. You\'re in jail.',1);log('Arrested. Jailed for '+Math.round(t)+'s.');S.chat.push({n:null,t:S.name+' got locked up.'})}
function hospitalize(){S.hp=0;S.hospUntil=now()+(60+S.level*5)*1000;S.fight=null;log('Sent to the hospital.')}
function blocked(){if(inJail()){toast('You\'re in jail.',1);return true}if(inHosp()){toast('You\'re in the hospital.',1);return true}return false}
function roomFor(q){if(stash()+q>stashCap()){toast('Not enough room. You can carry '+stashCap()+' units. Buy transportation to carry more.',1);return false}return true}

/* ================= COMBAT ================= */
function round(A,B){
  if(A.style==='fortress'&&B.style==='fortress')return{stale:1};
  const a=A.atk*A.boost*counter(A.style,B.style)*(R(85,115)/100)/Math.max(1,B.def*B.boost);
  const b=B.atk*B.boost*counter(B.style,A.style)*(R(85,115)/100)/Math.max(1,A.def*A.boost);
  const aw=a>=b;const ratio=aw?a/Math.max(.01,b):b/Math.max(.01,a);
  return{aw,dmg:Math.round(10+12*Math.min(2.5,ratio))};
}
function startFight(id){
  if(blocked())return;
  const r=S.rivals.find(x=>x.id===id);
  if(now()<r.hospUntil)return toast(r.name+' is still in the hospital.',1);
  if(S.stam<5)return toast('A fight costs 5 stamina.',1);
  if(S.hp<S.maxHp*.2)return toast('You\'re too hurt. Heal up in Services.',1);
  S.stam-=5;
  S.fight={rid:id,round:1,pw:0,ow:0,cur:r.style,lines:[],swapped:0,revealed:0};
  go('fight');save();
}
function fightRound(){
  const f=S.fight;if(!f||f.done)return;const r=S.rivals.find(x=>x.id===f.rid);
  if(f.lastSetup!==undefined&&f.lastSetup!==S.active)f.swapped=1;
  f.lastSetup=S.active;
  const A=meC(),B=rivalC(r,f.cur);
  const res=round(A,B);
  f.revealed=1;r.seen={style:B.style,atk:B.atk,def:B.def};
  if(res.stale)f.lines.push('Round '+f.round+': '+STYLES[A.style]+' vs '+STYLES[B.style]+'. Nobody gets through. No damage.');
  else if(res.aw){f.pw++;f.lines.push('Round '+f.round+': your '+STYLES[A.style]+' breaks '+r.name+'\'s '+STYLES[B.style]+(counter(A.style,B.style)>1?' (counter!)':'')+'.')}
  else{f.ow++;S.hp=Math.max(0,S.hp-res.dmg);f.lines.push('Round '+f.round+': '+r.name+'\'s '+STYLES[B.style]+' beats your '+STYLES[A.style]+(counter(B.style,A.style)>1?' (countered)':'')+'. −'+res.dmg+' HP.')}
  f.round++;
  if(S.hp<=0)f.ow=Math.max(f.ow,2);
  if(f.pw>=2||f.ow>=2||f.round>3){endFight(r);return}
  const beatsMe={close:'heavy',ranged:'close',heavy:'ranged',fortress:'heavy',bare:'close'}[A.style];
  if(f.cur!==beatsMe&&(r.alt===beatsMe||r.style===beatsMe)&&Math.random()<.6){f.cur=beatsMe;f.lines.push(r.name+' is switching setups…')}
  else if(Math.random()<.2){f.cur=f.cur===r.style?r.alt:r.style;f.lines.push(r.name+' is switching setups…')}
  done();
}
function endFight(r){
  const f=S.fight;
  if(f.pw>f.ow){
    S.wins++;const take=Math.round(r.cash*R(4,10)/100);r.cash-=take;S.cash+=take;gainXp(Math.round(12+r.level*4));addHeat(2);
    r.hospUntil=now()+90000;let loot='';
    if(Math.random()<.35&&r.seen){const ty=r.seen.style==='fortress'?'armor':r.seen.style;const pool=WEAPONS.filter(w=>w.type===ty&&w.price<4000+r.level*3000);if(pool.length){const w=pick(pool);const q=R(1,3);S.weapons[w.id]=(S.weapons[w.id]||0)+q;loot=' Looted '+q+' × '+w.name+'.'}}
    if(f.swapped)S.flags.swapWin=1;
    f.result='win';f.lines.push('You won and took '+fmt(take)+'. '+r.name+' is in the hospital.'+loot);
    toast('You beat '+r.name+'.'+loot);log('Beat '+r.name+' '+f.pw+'–'+f.ow+', took '+fmt(take)+'.'+loot);
    S.chat.push({n:r.name,t:pick(['ok you got that one','watch your back','lucky setup','this ain\'t over'])});
  }else if(f.ow>f.pw){
    S.losses++;const hp=R(8,14);f.result='loss';f.lines.push('You lost. You\'re in the hospital and your police heat rose '+hp+'%.');
    log('Lost to '+r.name+' '+f.pw+'–'+f.ow+'.');toast(r.name+' put you in the hospital.',1);
    const keep=f.lines,cur=f.cur;hospitalize();S.fight={done:1,rid:r.id,lines:keep,result:'loss',pw:f.pw,ow:f.ow,revealed:1,cur};addHeat(hp);done();return;
  }else{f.result='draw';f.lines.push('Draw. Both of you walk away.');log('Fought '+r.name+' to a draw.')}
  f.done=1;done();
}
function attackHood(i){
  if(blocked())return;
  const h=S.hoods[i];if(h.owner==='me')return;
  if(isAlly(h.owner))return toast('That block belongs to your cartel partner.',1);
  if(S.stam<5)return toast('Taking a block costs 5 stamina.',1);
  S.stam-=5;
  const st=h.owner?AI_CREWS.find(c=>c.id===h.owner).style:'close';
  const res=round(meC(),{atk:h.def*.7,def:h.def,style:st,boost:1});
  if(res.stale){toast('Both sides dug in. Nothing moved.');log(h.name+': standoff.')}
  else if(res.aw){const prev=h.owner;h.owner='me';h.def=Math.round(meC().def*.5)+15;gainXp(15);addHeat(3);toast('You took '+h.name+'.');log('Took '+h.name+(prev?' from '+crewName(prev):'')+'.');if(prev)S.chat.push({n:null,t:(S.crew||S.name)+' took '+h.name+' from '+crewName(prev)+'.'})}
  else{S.hp=Math.max(0,S.hp-res.dmg);addHeat(4);toast(h.name+' held. −'+res.dmg+' HP.',1);log('Failed to take '+h.name+'.');if(S.hp<=0)hospitalize()}
  done();
}
function fortify(i){const h=S.hoods[i];const c=1500+h.def*60;if(S.cash<c)return toast('Fortifying costs '+fmt(c)+'.',1);S.cash-=c;h.def+=20;toast(h.name+' fortified.');done()}
function ambush(){
  const foes=S.rivals.filter(r=>!isAlly(r.crew)&&now()>r.hospUntil&&r.level<=S.level+2);if(!foes.length)return;
  const r=pick(foes);const A=meC();let pw=0,ow=0;
  for(let i=0;i<3&&pw<2&&ow<2;i++){const res=round(A,rivalC(r,i?(Math.random()<.5?r.alt:r.style):r.style));if(res.stale)continue;if(res.aw)pw++;else{ow++;S.hp=Math.max(0,S.hp-res.dmg)}}
  if(ow>pw||S.hp<=0){const hp=R(8,14);hospitalize();addHeat(hp);toast(r.name+' jumped you. Your '+STYLES[A.style]+' setup didn\'t hold.',1);log(r.name+' attacked you and won. Hospital, police heat +'+hp+'%.')}
  else if(pw>ow){S.wins++;gainXp(8);r.hospUntil=now()+60000;toast(r.name+' tried you and lost.');log(r.name+' attacked you. Your '+STYLES[A.style]+' held.')}
  else log(r.name+' attacked you. Standoff, nobody hurt.');
}

/* ================= ACTIONS / SERVICES ================= */
function doAction(id){
  if(blocked())return;
  const a=ACTIONS.find(x=>x.id===id);
  if(S.energy<a.e)return toast('Not enough energy.',1);
  S.energy-=a.e;
  if(Math.random()<a.risk+S.heat/400){const loss=R(8,18);S.hp=Math.max(0,S.hp-loss);addHeat(a.heat+2);toast(a.name+' went bad. −'+loss+' HP.',1);log(a.name+': went bad, took '+loss+' damage.');if(S.hp<=0)hospitalize()}
  else{const c=R(...a.cash)*(1+S.level*.03);S.cash+=c;addHeat(a.heat);gainXp(a.xp);toast(a.name+': +'+fmt(c));log(a.name+': earned '+fmt(c)+'.')}
  done();
}
function layLow(){if(blocked())return;if(S.energy<5)return toast('Not enough energy.',1);S.energy-=5;S.heat=Math.max(0,S.heat-8);toast('You lay low. Police heat −8%.');done()}
function clearHeat(pct){const p=Math.min(pct,Math.floor(S.heat));if(!p)return;const c=clearCost(p);if(S.cash<c)return toast('Clearing '+p+'% costs '+fmt(c)+'.',1);S.cash-=c;S.heat-=p;toast('Police heat −'+p+'%.');log('Cleared '+p+'% police heat for '+fmt(c)+'.');done()}
function heal(){if(inHosp()){const c=healCost();if(S.cash<c)return toast('Checkout costs '+fmt(c)+'.',1);S.cash-=c;S.hospUntil=0;S.hp=S.maxHp;toast('Patched up and discharged.');done();return}const c=Math.round((S.maxHp-S.hp)*20);if(!c)return;if(S.cash<c)return toast('The doctor wants '+fmt(c)+'.',1);S.cash-=c;S.hp=S.maxHp;toast('Patched up.');done()}
function bail(){const c=bailCost();if(S.cash<c)return toast('Bail is '+fmt(c)+'.',1);S.cash-=c;S.jailUntil=0;toast('Bailed out.');done()}
function upgrade(k){if(S.points<1)return toast('No upgrade points. Level up to earn more.',1);
  if(k==='hp'){if(S.maxHp>=CAPS.hp)return;S.maxHp+=10;if(!inHosp())S.hp+=10}
  if(k==='stam'){if(S.maxStam>=CAPS.stam)return;S.maxStam+=5;S.stam+=5}
  if(k==='slots'){if(S.slots>=CAPS.slots)return;S.slots+=5}
  if(k==='energy'){if(S.maxEnergy>=CAPS.energy)return;S.maxEnergy+=5;S.energy+=5}
  S.points--;done()}
function buySheat(){const c=sheatCost();if(S.cash<c)return toast('Costs '+fmt(c)+'.',1);S.cash-=c;S.sheat+=R(5,10);S.sheatBuys++;toast('Word gets around. Your Street Heat went up.');done()}
function bankIt(d){if(d>0){const a=Math.min(S.cash,d);S.cash-=a;S.bank+=a*.95}else{const a=Math.min(S.bank,-d);S.bank-=a;S.cash+=a}done()}

/* ================= ITEMS ================= */
function buyWeapon(id,q){const w=W(id);const c=w.price*q;if(S.cash<c)return toast('Need '+fmt(c)+'.',1);S.cash-=c;S.weapons[id]=(S.weapons[id]||0)+q;toast('Bought '+q+' × '+w.name+'.');done()}
function buyGear(id){const g=G(id);if(S.gear[id])return;if(S.cash<g.price)return toast('Need '+fmt(g.price)+'.',1);S.cash-=g.price;S.gear[id]=1;toast('Bought '+g.name+'.');done()}
function sellWeapon(id){if(!(S.weapons[id]>0))return;const w=W(id);if(w.type==='vehicle'&&stash()>stashCap()-w.cap)return toast('Sell some product first. You need the cargo room.',1);S.weapons[id]--;S.cash+=w.price*.5;clampPresets();toast('Sold a '+w.name+' for '+fmt(w.price*.5)+'.');done()}
function clampPresets(){S.presets.forEach(p=>{for(const k in p.lo){p.lo[k]=Math.min(p.lo[k],S.weapons[k]||0);if(!p.lo[k])delete p.lo[k]}const ks=Object.keys(p.lo).sort((a,b)=>(W(a).atk+W(a).def)/W(a).slots-(W(b).atk+W(b).def)/W(b).slots);let i=0;while(slotted(p.lo)>S.slots&&i<ks.length){const k=ks[i];p.lo[k]--;if(!p.lo[k]){delete p.lo[k];i++}}})}
function setSlot(id,d){const p=S.presets[S.edit];const w=W(id);const cur=p.lo[id]||0;const used=slotted(p.lo);let n=cur+d;if(d>0)n=Math.min(n,S.weapons[id]||0,cur+Math.floor((S.slots-used)/w.slots));n=Math.max(0,n);if(n===cur&&d>0)return toast(S.slots-used<w.slots?w.name+' needs '+w.slots+' slot'+(w.slots>1?'s':'')+'. You have '+(S.slots-used)+' free.':'You don\'t own more of those.',1);p.lo[id]=n;if(!n)delete p.lo[id];done()}
function autofill(mode){
  const p=S.presets[S.edit];p.lo={};let left=S.slots;
  if(mode==='clear'){done();return}
  const pool=Object.keys(S.weapons).filter(k=>S.weapons[k]>0&&W(k)&&W(k).type!=='vehicle').map(W);
  if(mode==='bal'){let a=0,d=0;const avail=Object.fromEntries(pool.map(w=>[w.id,S.weapons[w.id]]));
    while(left>0){const cand=pool.filter(w=>avail[w.id]>0&&w.slots<=left);if(!cand.length)break;const w=cand.sort((x,y)=>(a<=d?(y.atk/y.slots-x.atk/x.slots)||(y.def-x.def):(y.def/y.slots-x.def/x.slots)||(y.atk-x.atk)))[0];p.lo[w.id]=(p.lo[w.id]||0)+1;avail[w.id]--;a+=w.atk;d+=w.def;left-=w.slots}}
  else{const score=w=>(mode==='atk'?w.atk*10+w.def:w.def*10+w.atk)/w.slots;for(const w of pool.sort((x,y)=>score(y)-score(x))){const n=Math.min(S.weapons[w.id],Math.floor(left/w.slots));if(n>0){p.lo[w.id]=n;left-=n*w.slots}if(!left)break}}
  done();
}

function buildProd(){const c=prodCost(S.prod.lvl);if(S.prod.lvl>=10)return;if(S.cash<c)return toast((S.prod.lvl?'The upgrade':'A Grow House')+' costs '+fmt(c)+'.',1);S.cash-=c;S.prod.lvl++;S.prod.on=true;toast(S.prod.lvl===1?'Your Grow House is up and running.':'Grow House upgraded to level '+S.prod.lvl+'.');log(S.prod.lvl===1?'Built a Grow House.':'Upgraded Grow House to level '+S.prod.lvl+'.');done()}
function setProd(id){if(P(id).lvl>S.prod.lvl)return toast('Needs a level '+P(id).lvl+' Grow House.',1);S.prod.item=id;S.prod.acc=0;toast('Now producing '+P(id).name+'.');done()}
let abandonArm=false;
function abandon(){if(!abandonArm){abandonArm=true;toast('Tap Abandon again to tear it down. You get nothing back.',1);render();setTimeout(()=>{abandonArm=false},4000);return}abandonArm=false;S.prod={lvl:0,item:'herbs',on:true,acc:0};toast('Grow House abandoned.');log('Abandoned the Grow House.');done()}

/* ================= MARKET ================= */
function trade(pid,qty){
  const p=S.prices[pid];
  if(qty>0){if(!roomFor(qty))return;const c=p*qty*1.04;if(S.cash<c)return toast('Not enough cash.',1);S.cash-=c;S.inv[pid]=(S.inv[pid]||0)+qty;toast('Bought '+qty+' '+P(pid).name+'.')}
  else{const have=S.inv[pid]||0;const q=Math.min(have,-qty);if(!q)return toast('Nothing to sell.',1);S.inv[pid]=have-q;S.cash+=p*q;S.prices[pid]*=1-.004*q;toast('Sold '+q+' '+P(pid).name+' for '+fmt(p*q)+'.')}
  done();
}
const nid=()=>Math.random().toString(36).slice(2);
function seedListings(){
  S.listings=S.listings.filter(L=>L.exp>S.tick);
  while(S.listings.length<20){
    if(Math.random()<.7){const p=pick(PRODUCTS);S.listings.push({id:nid(),by:pick(NAMES),kind:'p',ref:p.id,qty:pick([5,10,25,25,30,50,100]),price:Math.round(S.prices[p.id]*(R(92,108)/100)),exp:S.tick+R(20,48)*15})}
    else{const w=pick(WEAPONS.filter(x=>x.price<60000));S.listings.push({id:nid(),by:pick(NAMES),kind:'w',ref:w.id,qty:R(1,8),price:Math.round(w.price*(R(62,95)/100)),exp:S.tick+R(20,48)*15})}
  }
}
const lname=L=>L.kind==='p'?P(L.ref).name:W(L.ref).name;
const lfair=L=>L.kind==='p'?S.prices[L.ref]:W(L.ref).price;
function buyListing(id){const L=S.listings.find(x=>x.id===id);if(!L)return;const tot=L.price*L.qty;if(L.kind==='p'&&!roomFor(L.qty))return;if(S.cash<tot)return toast('Need '+fmt(tot)+'.',1);S.cash-=tot;if(L.kind==='p')S.inv[L.ref]=(S.inv[L.ref]||0)+L.qty;else S.weapons[L.ref]=(S.weapons[L.ref]||0)+L.qty;S.listings=S.listings.filter(x=>x!==L);toast('Deal done with '+L.by+'.');seedListings();done()}
function listMine(){const v=ui.mprod;const q=+$('#lq').value,pr=+$('#lpr').value;if(!q||q<1||!pr)return toast('Enter a quantity and a price per unit.',1);
  let kind='p',ref=v;if(v==='items'){kind='w';ref=$('#lw').value;if(!ref)return toast('You have no items to sell.',1)}
  const pool=kind==='p'?S.inv:S.weapons;if((pool[ref]||0)<q)return toast('You don\'t hold that many.',1);pool[ref]-=q;if(kind==='w')clampPresets();S.myListings.push({id:nid(),kind,ref,qty:q,price:pr,exp:S.tick+48*15});toast('Listed for 48 h on the marketplace.');done()}
function pullListing(id){const L=S.myListings.find(x=>x.id===id);const pool=L.kind==='p'?S.inv:S.weapons;pool[L.ref]=(pool[L.ref]||0)+L.qty;S.myListings=S.myListings.filter(x=>x!==L);done()}

/* ================= CREW / SOCIAL ================= */
function foundCrew(){const n=$('#crewname').value.trim();if(n.length<3)return toast('Pick a crew name, 3+ letters.',1);if(S.cash<25000)return toast('Founding a crew costs $25,000.',1);S.cash-=25000;S.crew=n.slice(0,24);S.chat.push({n:null,t:'New crew on the street: '+S.crew});toast(S.crew+' is official.');done()}
function recruit(){const c=3000+S.soldiers*1500;if(S.cash<c)return toast('Next soldier costs '+fmt(c)+'.',1);S.cash-=c;S.soldiers++;toast('A new soldier joins '+S.crew+'.');done()}
function formCartel(id){const c=AI_CREWS.find(x=>x.id===id);if(S.level<8)return toast('Crews only sit down with level 8+ bosses.',1);if(S.cash<100000)return toast('A sit-down costs $100,000.',1);S.cash-=100000;S.cartel=id;S.chat.push({n:null,t:S.crew+' and '+c.name+' formed a cartel.'});toast('Cartel formed with '+c.name+'.');done()}
function say(){const i=$('#say');const t=i.value.trim();if(!t)return;S.chat.push({n:S.name,t:t.slice(0,200),me:1});i.value='';done();const c=$('#content');c.scrollTop=c.scrollHeight}
function post(){const i=$('#thread');const t=i.value.trim();if(t.length<4)return toast('Give the thread a title.',1);S.threads.unshift({t:t.slice(0,80),by:S.name,r:0});i.value='';done()}

/* ================= TICK ================= */
let wasLocked=false;
function tick(){
  if(!S.name)return;
  S.tick++;
  if(!inJail()){S.energy=Math.min(S.maxEnergy,S.energy+1);S.stam=Math.min(S.maxStam,S.stam+1)}
  if(!inHosp()&&S.tick%2===0)S.hp=Math.min(S.maxHp,S.hp+Math.ceil(S.maxHp/50));
  if(S.hospUntil&&!inHosp()&&S.hp<S.maxHp*.5){S.hp=Math.round(S.maxHp*.5);S.hospUntil=0;toast('Discharged from the hospital.');log('Discharged from the hospital.')}
  if(S.jailUntil&&!inJail()){S.jailUntil=0;toast('Released from jail.');log('Released from jail.')}
  // production: level units per game hour (1 game hour = 15 ticks = 1 minute)
  if(S.prod.lvl&&S.prod.on){S.prod.acc+=S.prod.lvl/15;const u=Math.floor(S.prod.acc);if(u){S.prod.acc-=u;const room=stashCap()-stash();const add=Math.min(u,room);if(add>0)S.inv[S.prod.item]=(S.inv[S.prod.item]||0)+add;else if(S.tick%15===0)toast('Your stash is full. Production is going to waste.',1)}addHeat(S.prod.lvl*.03)}
  S.cash+=myHoods().reduce((a,h)=>a+h.income,0)*(S.cartel?1.15:1)/15;
  if(S.tick%15===0)S.bank*=1.003;
  if(S.tick%20===0&&S.heat>0)S.heat=Math.max(0,S.heat-1);
  PRODUCTS.forEach(p=>{const v=S.prices[p.id];const nv=Math.max(p.base*.35,v*(1+(p.base-v)/p.base*.08+(Math.random()-.5)*.09));S.trend[p.id]=nv>v?1:-1;S.prices[p.id]=nv});
  if(Math.random()<.04){const p=pick(PRODUCTS);S.prices[p.id]*=pick([.7,1.4]);S.chat.push({n:null,t:'Market shock: '+p.name+' '+(S.prices[p.id]>p.base?'shortage, prices spike.':'flood, prices crash.')})}
  if(S.heat>50&&!inJail()&&Math.random()<S.heat/1600){const lose=Math.round(S.cash*.2);S.cash-=lose;PRODUCTS.forEach(p=>S.inv[p.id]=Math.floor((S.inv[p.id]||0)*.5));toast('Raid! Lost '+fmt(lose)+' and half your product.',1);log('Police raid: lost '+fmt(lose)+' and half your stash.')}
  S.rivals.forEach(r=>{r.cash+=R(20,260)*r.level/3;if(Math.random()<.025)r.level++;if(Math.random()<.01)r.sh+=R(2,6)});
  if(Math.random()<.16){const h=pick(S.hoods);const c=pick(AI_CREWS);if(h.owner!==c.id&&!isAlly(c.id)){
    if(h.owner==='me'){if(Math.random()<.3*(80/(h.def+80))){h.owner=c.id;h.def=R(30,90);toast(c.name+' took '+h.name+' from you.',1);log(c.name+' took '+h.name+'.')}}
    else if(Math.random()<.4){h.owner=c.id;S.chat.push({n:null,t:c.name+' moved on '+h.name+'.'})}}}
  if(!locked()&&!(S.fight&&!S.fight.done)&&S.tick>8&&Math.random()<.025)ambush();
  S.myListings.forEach(L=>{const fair=lfair(L)*(L.kind==='w'?.8:1);if(Math.random()<Math.max(.03,.5-(L.price/fair-1)*1.4)){S.cash+=L.price*L.qty;L.sold=1;toast('Sold '+L.qty+' × '+lname(L)+' for '+fmt(L.price*L.qty)+'.');log('Marketplace sale: '+L.qty+' × '+lname(L)+' for '+fmt(L.price*L.qty)+'.')}else if(L.exp<=S.tick){const pool=L.kind==='p'?S.inv:S.weapons;pool[L.ref]=(pool[L.ref]||0)+L.qty;L.sold=1;log('Listing expired: '+L.qty+' × '+lname(L)+' returned.')}});
  S.myListings=S.myListings.filter(L=>!L.sold);
  if(Math.random()<.08&&S.listings.length)S.listings.splice(R(0,S.listings.length-1),1);
  seedListings();
  if(Math.random()<.35){const r=pick(S.rivals);S.chat.push({n:r.name,t:pick(CHAT).replace('{c}',crewName(pick(AI_CREWS).id)).replace('{n}',r.level).replace('{p}',pick(NAMES))})}
  if(S.chat.length>80)S.chat=S.chat.slice(-80);
  if(Math.random()<.05)pick(S.threads).r++;
  checkAcc();save();
  const lk=locked();const pg=cur();
  if((['market','world','people','production','fight','home','chat'].includes(pg)||lk!==wasLocked)&&!busy()){const c=$('#content');const atBottom=c.scrollHeight-c.scrollTop-c.clientHeight<40;const st=c.scrollTop;render(true);c.scrollTop=pg==='chat'&&atBottom?c.scrollHeight:st}else{renderChrome()}
  wasLocked=lk;
}

  '<p class="note">Slots <b>'+used+' / '+S.slots+'</b>. Your active setup (★) fights for you and defends you when you\'re attacked. You can switch setups between rounds of a fight.</p>'+
  '<div class="row"><button class="ib sm" data-do="auto" data-v="atk">Fill max attack</button><button class="ib sm" data-do="auto" data-v="bal">Fill balanced</button><button class="ib sm" data-do="auto" data-v="def">Fill max defense</button><button class="ib sm" data-do="auto" data-v="clear">Empty</button></div>'+
  (S.active===S.edit?'<span class="pill yel">Active setup</span>':'<button class="ib blue" data-do="use" data-i="'+S.edit+'">Make this my active setup</button>')+'</div></div>'+(groups||'<div class="pad"><p class="note">You own nothing to equip. Visit the Items Store.</p></div>')+
  '<div class="sh">Set bonuses</div><div class="list">'+SETS.map(x=>{const on=t.bonus.sets.includes(x);return row('',x.name+' <span class="pill '+(on?'green':'')+'">+'+x.bonus+'</span>',x.items.map(i=>'<span class="'+(p.lo[i]?'up':'')+'">'+W(i).name+'</span>').join(', '),on?'<span class="pill green">Active</span>':'<span></span>')}).join('')+PENALTIES.map(x=>{const on=t.bonus.pens.includes(x);return row('',x.name+' <span class="pill red">'+x.bonus+'</span>',x.d,on?'<span class="pill red">Active</span>':'<span></span>')}).join('')+'</div>';

PAGES.trade={t:'Buy/Sell/Trade',r:()=>'<div class="list">'+menu('m_store','Items Store','store','Weapons, protection items, transportation')+menu('m_market','Marketplace','market','Buy and sell product and items with players')+menu('m_setups','Weapon Setups','setups','Equip what you own into your slots')+'</div>'};
PAGES.store={t:'Items Store',r:()=>{

PAGES.market={t:'Marketplace',r:()=>{
  const sel=ui.mprod;
  let html='<div class="chips"><span>Select product :</span>'+PRODUCTS.map(p=>'<button class="chip" data-do="mprod" data-id="'+p.id+'" aria-pressed="'+(sel===p.id)+'">'+p.name+'</button>').join('')+'<button class="chip" data-do="mprod" data-id="items" aria-pressed="'+(sel==='items')+'">Items</button></div>';
  if(sel!=='items'){const p=P(sel);const pr=S.prices[sel];const h=S.inv[sel]||0;
    html+='<div class="pad"><div class="box"><div class="row" style="justify-content:space-between"><h3>'+p.name+' trade at '+fmt(pr)+' a unit</h3><span class="'+(S.trend[sel]>0?'up':'down')+'">'+(S.trend[sel]>0?'▲':'▼')+'</span></div><p class="note">You hold <b>'+h+'</b>. Stash <b>'+stash()+' / '+stashCap()+'</b> units. Street buys carry a 4% markup.</p><div class="row"><button class="ib sm" data-do="buy" data-id="'+sel+'" data-v="5">Buy 5</button><button class="ib sm" data-do="buy" data-id="'+sel+'" data-v="25">Buy 25</button><button class="ib sm" data-do="sell" data-id="'+sel+'" data-v="5" '+(h?'':'disabled')+'>Sell 5</button><button class="ib sm blue" data-do="sell" data-id="'+sel+'" data-v="1e9" '+(h?'':'disabled')+'>Sell all</button></div></div></div>';}
  const ls=S.listings.filter(L=>sel==='items'?L.kind==='w':L.kind==='p'&&L.ref===sel).sort((a,b)=>a.price-b.price);
  html+='<div class="sh">Player listings</div><div class="list">'+(ls.length?ls.map(L=>{const deal=lfair(L)-L.price;return row(ic(L.ref),(L.kind==='w'?esc(lname(L))+' · ':'')+'Quantity '+L.qty,'Price/unit <b>'+fmt(L.price)+'</b> · '+esc(L.by)+(L.kind==='w'?' · Att/Def '+W(L.ref).atk+'/'+W(L.ref).def:''),'<div class="right"><span>Time <b>'+gameHrs(L.exp)+' h</b></span><button class="ib sm '+(deal>0?'blue':'')+'" data-do="buyl" data-id="'+L.id+'">Buy '+fmtK(L.price*L.qty)+'</button></div>')}).join(''):row('','No listings right now.','Check back soon.'))+'</div>';
  const mine=S.myListings.filter(L=>sel==='items'?L.kind==='w':L.ref===sel);
  const ownedItems=WEAPONS.filter(w=>S.weapons[w.id]>0);
  html+='<div class="sh">Sell to players</div><div class="pad"><div class="row">'+(sel==='items'?'<select id="lw" aria-label="Item">'+ownedItems.map(w=>'<option value="'+w.id+'">'+w.name+' ('+S.weapons[w.id]+')</option>').join('')+'</select>':'')+'<input id="lq" type="number" min="1" placeholder="Qty" style="width:72px" aria-label="Quantity"><input id="lpr" type="number" min="1" placeholder="Price/unit" style="width:110px" aria-label="Price per unit"><button class="ib blue" data-do="list">List 48 h</button></div><p class="note">Price near street value and players snap it up. Unsold listings return to you when time runs out.</p></div>'+
  (mine.length?'<div class="list">'+mine.map(L=>row(ic(L.ref),'Quantity '+L.qty+(L.kind==='w'?' · '+esc(lname(L)):''),'Your price/unit <b>'+fmt(L.price)+'</b>','<div class="right"><span>Time <b>'+gameHrs(L.exp)+' h</b></span><button class="ib sm" data-do="pull" data-id="'+L.id+'">Pull</button></div>')).join('')+'</div>':'');
  return html;
}};
PAGES.production={t:'Production',r:()=>{
  const pr=S.prod;

  return '<div class="pad"><div class="hero"><svg viewBox="0 0 64 40">'+ICONS.greenhouse+'</svg></div><div class="box"><dl class="kv"><dt>In production</dt><dd>'+p.name+(pr.on?'':' (stopped)')+'</dd><dt>Current level</dt><dd>'+pr.lvl+'</dd><dt>Stash</dt><dd>'+stash()+' / '+stashCap()+' units</dd></dl>'+
  '<button class="ib '+(pr.on?'':'blue')+'" data-do="toggleprod">'+(pr.on?'Stop Production':'Start Production')+'</button></div>'+
  '<div class="box"><h3>Product</h3><div class="row">'+PRODUCTS.map(x=>'<button class="chip" data-do="setprod" data-id="'+x.id+'" aria-pressed="'+(pr.item===x.id)+'" '+(x.lvl>pr.lvl?'disabled style="opacity:.45"':'')+'>'+x.name+(x.lvl>pr.lvl?' · L'+x.lvl:'')+'</button>').join('')+'</div></div>'+
  '<div class="box">'+(pr.lvl<10?'<p class="note">Upgrade to produce more commodities. You can upgrade your Grow House. Price for the next upgrade is <b>'+fmt(prodCost(pr.lvl))+'</b>.</p><button class="ib blue" data-do="build">Upgrade Grow House</button>':'<p class="note">Your Grow House is at max level.</p>')+
  '<button class="ib red" data-do="abandon">'+(abandonArm?'Tap again to abandon':'Abandon Grow House')+'</button></div>'+
  '<p class="note" style="text-align:center">You produce '+pr.lvl+' unit'+(pr.lvl>1?'s':'')+' of '+p.name+' every hour. Production adds police heat while running.</p></div>';

PAGES.forum={t:'Forum',r:()=>'<div class="list">'+S.threads.slice(0,20).map(t=>row(ic('m_forum'),esc(t.t),'by '+esc(t.by),'<div class="right"><b>'+t.r+'</b><span>replies</span></div>')).join('')+'</div><form class="composer" id="threadf"><input id="thread" maxlength="80" placeholder="Start a new thread" aria-label="Thread title"><button class="ib blue">Post</button></form>'};
PAGES.services={t:'Services',r:()=>{
  const hc=Math.round((S.maxHp-S.hp)*20);

  '<div class="sh">Police heat · '+Math.floor(S.heat)+'%</div><div class="pad"><p class="note">At 100% you get arrested. Losing fights, jobs gone bad and production push it up. Clearing it costs more the higher your level.</p><div class="row"><button class="ib sm" data-do="low">Lay low (5 energy, −8%)</button><button class="ib sm" data-do="clear" data-v="25" '+(S.heat>=1?'':'disabled')+'>Clear 25% · '+fmt(clearCost(Math.min(25,Math.floor(S.heat))))+'</button><button class="ib sm blue" data-do="clear" data-v="100" '+(S.heat>=1?'':'disabled')+'>Clear all · '+fmt(clearCost(Math.floor(S.heat)))+'</button></div>'+(inJail()?'<button class="ib red" data-do="bail">Post bail · '+fmt(bailCost())+'</button>':'')+'</div>'+
  '<div class="sh">Street Heat</div><div class="pad"><p class="note">Buy reputation that makes your attacks hit harder and your defense hold longer. The amount is never shown to you or anyone else. Each purchase costs more than the last. Bought <b>'+S.sheatBuys+'×</b>.</p><button class="ib yel" data-do="sheat">Buy Street Heat · '+fmt(sheatCost())+'</button></div>'+
  '<div class="sh">Bank · '+fmt(S.bank)+'</div><div class="pad"><p class="note">Raids can\'t touch the bank. Deposits carry a 5% washing fee and earn 0.3% every game hour.</p><div class="row"><button class="ib sm" data-do="dep" data-v="1000">Deposit $1K</button><button class="ib sm" data-do="dep" data-v="10000">$10K</button><button class="ib sm blue" data-do="dep" data-v="1e12">All</button><button class="ib sm" data-do="wd" data-v="10000">Withdraw $10K</button><button class="ib sm" data-do="wd" data-v="1e12">Withdraw all</button></div></div>'+
  '<div class="sh">Equipment</div><div class="list">'+GEAR.map(g=>row(ic(g.id),g.name,g.d,S.gear[g.id]?'<span class="pill green">Owned</span>':'<button class="ib sm blue" data-do="bg" data-id="'+g.id+'">'+fmt(g.price)+'</button>')).join('')+'</div>';

function rivalRows(){return S.rivals.slice().sort((a,b)=>a.level-b.level).map(r=>{const al=isAlly(r.crew);const hosp=now()<r.hospUntil;
  return row('',esc(r.name)+' <span class="pill '+(al?'blue':'red')+'">'+esc(crewName(r.crew))+'</span>','Level '+r.level+' · '+fmtK(r.cash)+(r.seen?' · last seen '+STYLES[r.seen.style]+' '+r.seen.atk+'/'+r.seen.def:' · setup unscouted'),al?'<span class="pill blue">Cartel</span>':hosp?'<span class="pill">Hospital '+secs(r.hospUntil)+'</span>':'<button class="ib sm red" data-do="hit" data-id="'+r.id+'" '+(S.fight&&!S.fight.done?'disabled':'')+'>Attack</button>')}).join('')}
PAGES.people={t:'People',r:()=>segH('peopleSeg',[['top','Top Users'],['players','Players']])+(ui.peopleSeg==='top'?
  '<div class="tw"><table><thead><tr><th>#</th><th>Player</th><th>Crew</th><th>Lvl</th><th>Net worth</th></tr></thead><tbody>'+board().map((x,i)=>'<tr class="'+(x.me?'me':'')+'"><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.crew)+'</td><td>'+x.level+'</td><td>'+fmtK(x.worth)+'</td></tr>').join('')+'</tbody></table></div>':
  '<div class="pad"><p class="note">Attacks cost 5 stamina. Fights are best of three rounds.</p></div><div class="list">'+rivalRows()+'</div>')};
PAGES.faq={t:'FAQ',r:()=>'<div class="pad">'+
 '<div class="box"><h3>Getting started</h3><p class="note">Do jobs in <b>Actions</b> for cash and XP. Buy weapons in the <b>Items Store</b> and equip them in <b>Weapon Setups</b>. Build a <b>Grow House</b> and sell product on the <b>Marketplace</b>. Take blocks in <b>The World</b>.</p></div>'+
 '<div class="box"><h3>Setups and fractions</h3><p class="note">Every item has an attack/defense rating and uses 1 to 10 slots. Your fraction = equipped items + base 25/25 + your best vehicle. You start with 20 slots and can upgrade to 120.</p></div>'+
 '<div class="box"><h3>Set bonuses</h3><p class="note">Equip one of each item in a set (Kevlar, Grenade, Launcher, Rifle, Handtool, Small Arms, Shotgun) for a bonus. Some combos cost you bonus, like a HUMVEE with HV weapons or more than 2 TOW Missiles. Each bonus point is worth 2% fight power.</p></div>'+
 '<div class="box"><h3>Counters</h3><p class="note"><b>Knife Fight</b> (mostly close weapons) beats <b>Gunline</b> (firearms). Gunline beats <b>Demolition</b> (heavy). Demolition beats Knife Fight and cracks <b>Fortress</b>. A setup is a Fortress when defense is at least 1.4× attack. Two Fortress setups can\'t damage each other.</p></div>'+
 '<div class="box"><h3>Two kinds of heat</h3><p class="note"><b>Street Heat</b> is bought in Services. It\'s hidden and boosts your fight power. <b>Police heat</b> is the % in the status bar. At 100% you go to jail. Losers of fights take police heat and go to the hospital.</p></div>'+
 '<div class="box"><h3>Time</h3><p class="note">Energy and stamina refill one point every 4 seconds. One game hour is one real minute.</p></div></div>'};
PAGES.credits={t:'Credits',r:()=>'<div class="pad"><div class="hero"><svg viewBox="0 0 64 40">'+ICONS.m_credits+'</svg></div><div class="box"><h3>Cartel Wars</h3><p class="note">A tribute to the original Cartel Wars iPhone game. Rebuilt by Juan with Claude.</p><p class="note">Every player, crew and chat message in this version is simulated, and your progress saves in this browser.</p></div></div>'};
PAGES.crew={t:'My Crew',r:()=>{
  if(!S.crew)return '<div class="pad"><div class="box"><h3>Start a crew</h3><p class="note">A crew lets you recruit soldiers (+2% fight power each) and opens the door to a cartel with another crew. Founding costs $25,000.</p><input id="crewname" maxlength="24" placeholder="Crew name" aria-label="Crew name"><button class="ib blue" data-do="crew">Found crew</button></div></div><div class="sh">Crews in the city</div><div class="list">'+AI_CREWS.map(c=>row(ic('m_people'),c.name,'Blocks '+S.hoods.filter(h=>h.owner===c.id).length+' · fights '+STYLES[c.style])).join('')+'</div>';

  '<div class="sh">Cartels</div><div class="pad"><p class="note">A cartel gives +10% fight power, +15% block income, and peace with that crew. Crews only sit down with level 8+ bosses.</p></div><div class="list">'+AI_CREWS.map(c=>row(ic('m_people'),c.name,'Blocks '+S.hoods.filter(h=>h.owner===c.id).length+' · fights '+STYLES[c.style],S.cartel===c.id?'<button class="ib sm red" data-do="uncartel">Dissolve</button>':S.cartel?'<span></span>':'<button class="ib sm blue" data-do="cartel" data-id="'+c.id+'">Sit down $100K</button>')).join('')+'</div>';
}};
PAGES.actions={t:'Actions',r:()=>'<div class="pad"><p class="note">Jobs cost energy and raise police heat. Some need items you own.</p></div><div class="list">'+ACTIONS.map(a=>{const miss=a.req.filter(r=>!has(r));const lock=S.level<a.lvl;
  return row('',a.name,'Energy <b>'+a.e+'</b> · '+fmt(a.cash[0])+'–'+fmt(a.cash[1])+' · heat '+(a.heat>0?'+':'')+a.heat+'%'+(a.req.length?'<br>Needs: '+a.req.map(r=>'<span class="'+(has(r)?'up':'down')+'">'+(W(r)||G(r)).name+'</span>').join(', '):''),'<button class="ib sm '+(lock||miss.length?'':'blue')+'" data-do="act" data-id="'+a.id+'" '+(lock||miss.length?'disabled':'')+'>'+(lock?'Lvl '+a.lvl:'Do it')+'</button>')}).join('')+'</div>'};
PAGES.world={t:'The World',r:()=>{
  const seg=segH('worldSeg',[['hoods','Hoods'],['players','Players']]);
  if(ui.worldSeg==='players')return seg+'<div class="list">'+rivalRows()+'</div>';

  const cells=S.hoods.map((h,i)=>{const cls=h.owner==='me'?'mine':isAlly(h.owner)?'ally':h.owner?'foe':'';return '<button class="blk '+cls+'" data-do="selhood" data-i="'+i+'" aria-pressed="'+(ui.sel===i)+'"><b>'+h.name+'</b><span>'+fmtK(h.income)+'/h</span></button>'}).join('');
  let det='';
  if(ui.sel!=null){const h=S.hoods[ui.sel];const own=h.owner==='me';const st=h.owner&&h.owner!=='me'?AI_CREWS.find(c=>c.id===h.owner).style:null;
    det='<div class="box"><div class="row" style="justify-content:space-between"><h3>'+h.name+'</h3><span class="pill '+(own?'yel':isAlly(h.owner)?'blue':h.owner?'red':'')+'">'+esc(crewName(h.owner))+'</span></div><p class="note">Income <b>'+fmt(h.income)+'/h</b> · Defense <b>'+h.def+'</b>'+(st?' · Crew fights <b>'+STYLES[st]+'</b>':'')+'</p>'+
    (own?'<button class="ib blue" data-do="fort" data-i="'+ui.sel+'">Fortify +20 def · '+fmt(1500+h.def*60)+'</button>':isAlly(h.owner)?'<p class="note">Cartel partner territory.</p>':'<button class="ib red" data-do="hood" data-i="'+ui.sel+'">Move on it · 5 stamina</button>')+'</div>'}
  return seg+'<div class="pad"><p class="note">You hold <b>'+mine.length+'</b> of 25 blocks for <b class="up">'+fmt(inc)+'/h</b>'+(S.cartel?' (cartel +15%)':'')+'. Tap a block to scout it.</p><div class="map">'+cells+'</div>'+det+'<div class="row"><span class="pill yel">Yours</span><span class="pill blue">Cartel</span><span class="pill red">Rival</span><span class="pill">Open</span></div></div>';

PAGES.chat={t:'Chat List',r:()=>'<div class="msgs">'+S.chat.slice(-60).map(m=>m.n?'<div class="msg'+(m.me?' me':'')+'"><span class="n">'+esc(m.n)+':</span> '+esc(m.t)+'</div>':'<div class="msg sys">'+esc(m.t)+'</div>').join('')+'</div><form class="composer" id="chatf"><input id="say" maxlength="200" placeholder="Say something to the city" aria-label="Chat message"><button class="ib blue">Send</button></form>'};
PAGES.fight={t:'Fight',r:()=>{
  const f=S.fight;if(!f)return '<div class="pad"><p class="note">No fight in progress.</p><button class="ib" data-do="back">Back</button></div>';
  const r=S.rivals.find(x=>x.id===f.rid);const me=totals(S.presets[S.active].lo);const op=f.revealed?rivalC(r,f.cur):null;
  const pips=n=>'<div class="pips">'+[0,1].map(i=>'<i class="'+(i<n?'w':'')+'"></i>').join('')+'</div>';
  return '<div class="pad"><div class="box"><div class="row" style="justify-content:space-between"><h3>'+(f.done?(f.result==='win'?'Victory':f.result==='loss'?'Defeat':'Draw'):'Round '+f.round+' of 3')+'</h3><span class="pill red">vs '+esc(r.name)+' · lvl '+r.level+'</span></div>'+
  '<div class="vs"><div class="side"><small>You · '+STYLES[me.style]+'</small>'+fracH(me.atk,me.def,1)+pips(f.pw)+'</div><div class="mid">VS</div><div class="side"><small>'+esc(r.name)+' · '+(op?STYLES[op.style]:'hidden')+'</small>'+(op?fracH(op.atk,op.def,1):'<div class="frac sm"><span class="s">??? / ???</span></div>')+pips(f.ow)+'</div></div></div></div>'+
  '<div class="list">'+(f.lines.length?f.lines.map(l=>row('',esc(l))).join(''):row('','Their setup is hidden until round one.','After each round you can switch setups to counter them.'))+'</div>'+
  (f.done?'<div class="pad"><button class="ib blue" data-do="closefight">Done</button></div>':
  '<div class="sh">Switch setup before the next round</div>'+'<div class="seg" role="group">'+S.presets.map((s,i)=>{const t=totals(s.lo);return '<button data-do="swap" data-i="'+i+'" aria-pressed="'+(S.active===i)+'">'+t.atk+'/'+t.def+'</button>'}).join('')+'</div><div class="pad"><button class="ib red" data-do="round">Fight round '+f.round+'</button></div>');
}};

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){const k=t.dataset.tab;if(ui.tab===k&&!ui.stack.length)return;ui.tab=k;ui.stack=[];S.flags.confirmReset=0;render();$('#content').scrollTop=0;return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const sg=e.target.closest('[data-seg]');if(sg){ui[sg.dataset.seg]=sg.dataset.v;render();return}
  const b=e.target.closest('[data-do]');if(!b||b.disabled)return;
  const d=b.dataset,id=d.id,i=+d.i,v=+d.v;
  ({start(){const n=$('#nm').value.trim();if(n.length<2)return toast('Pick a street name.',1);S.name=n.slice(0,18);S.chat.push({n:null,t:S.name+' just arrived in the city.'});save();render()},
    back,act(){doAction(id)},low:layLow,clear(){clearHeat(v)},heal,bail,dep(){bankIt(v)},wd(){bankIt(-v)},
    selhood(){ui.sel=ui.sel===i?null:i;render(true)},hood(){attackHood(i)},fort(){fortify(i)},
    build:buildProd,setprod(){setProd(id)},toggleprod(){S.prod.on=!S.prod.on;toast(S.prod.on?'Production started.':'Production stopped.');done()},abandon,
    mprod(){ui.mprod=id;render(true)},buy(){trade(id,v)},sell(){trade(id,-v)},buyl(){buyListing(id)},list:listMine,pull(){pullListing(id)},
    bw(){buyWeapon(id,v)},bg(){buyGear(id)},sheat:buySheat,
    up(){upgrade(id)},editset(){S.edit=i;render(true)},use(){S.active=i;toast(S.presets[i].name+' is now active.');done()},slot(){setSlot(id,v)},auto(){autofill(d.v)},
    hit(){startFight(id)},round:fightRound,swap(){S.active=i;save();render(true)},closefight(){S.fight=null;back()},
    crew:foundCrew,recruit,cartel(){formCartel(id)},uncartel(){S.cartel=null;toast('Cartel dissolved.');done()},
    reset(){if(!S.flags.confirmReset){S.flags.confirmReset=1;render(true);return}const n=S.name;S=fresh();S.lastName=n;seedListings();save();ui.tab='home';ui.stack=[];render()}
  })[d.do]?.();
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='chatf')say();if(e.target.id==='threadf')post()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm')document.querySelector('[data-do="start"]').click()});

function start(){seedListings();if(S.fight&&!S.fight.done){ui.tab='world';ui.stack=['fight']}ui.lastChat=S.chat.length;render();wasLocked=locked();setInterval(tick,4000);setInterval(()=>{if(locked())renderChrome()},1000)}
start();
})();
</script>

</body></html>
